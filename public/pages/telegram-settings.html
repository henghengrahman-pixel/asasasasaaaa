<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram Settings</title><link rel="stylesheet" href="/static/css/theme.css"><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/layout.css"><link rel="stylesheet" href="/static/css/components.css"><link rel="stylesheet" href="/static/css/forms.css"><link rel="stylesheet" href="/static/css/tables.css"><link rel="stylesheet" href="/static/css/responsive.css"></head><body data-page="telegram-settings"><section id="page-content"><div class="page-head"><div><div class="kpi-label">INTEGRATION / BRIDGE</div><h1>Telegram Settings</h1><p class="muted">Bot, default group, routing kategori, test connection dan status bridge.</p></div><div class="toolbar"><button class="btn ghost" id="testTelegram">Test Bot</button><button class="btn gold" id="saveTelegram">Simpan</button></div></div><div class="split-2"><div class="card"><div class="section-title"><h3>Bridge Configuration</h3><label class="check"><input id="tgEnabled" type="checkbox"> Enabled</label></div><div class="form-grid"><div class="field wide"><label>Bot Token <span id="tokenMasked" class="muted"></span></label><input id="botToken" type="password" placeholder="Isi hanya jika ingin mengganti token"></div><div class="field"><label>Default Chat ID</label><input id="defaultChatId"></div><div class="field"><label>Bot Username</label><input id="botUsername" disabled></div></div></div><div class="card"><h3>Routing Category</h3><div id="telegramRoutes" class="route-list"></div></div></div><div class="card section-gap"><div class="section-title"><h3>Bridge Status</h3><button class="btn ghost" id="refreshTickets">Refresh Ticket</button></div><div id="telegramStatus" class="grid cards"></div><div class="table-wrap section-gap"><table class="data-table"><thead><tr><th>Ticket</th><th>Category</th><th>Conversation</th><th>Status</th><th>Updated</th></tr></thead>

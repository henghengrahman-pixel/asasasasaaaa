<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archives</title><link rel="stylesheet" href="/static/css/theme.css"><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/layout.css"><link rel="stylesheet" href="/static/css/components.css"><link rel="stylesheet" href="/static/css/forms.css"><link rel="stylesheet" href="/static/css/archives.css"><link rel="stylesheet" href="/static/css/responsive.css"></head><body data-page="archives"><section id="page-content" class="archives-page"><div class="archives-shell"><aside class="archives-list-pane"><div class="archives-head"><div><h1>Archives</h1><p>History chat per session yang sudah selesai.</p></div><button id="refreshArchives" class="icon-btn" title="Refresh">↻</button></div><div class="archives-tools"><label class="archive-search"><span>⌕</span><input id="archiveSearch" placeholder="Search in archives..." autocomplete="off"></label><div class="archive-toolbar"><select id="archiveFilter" aria-label="Filter archives"><option value="ALL">+ Add filter</option><option value="AI">Handled by AI</option><option value="HUMAN">Handled by Human</option></select><select id="archiveSort" aria-label="Sort archives"><option value="NEWEST">Newest</option></select></div><div class="archive-summary"><span id="archiveCount">0 chats</span></div></div><div id="archiveList" class="archive-list"><div class="archive-empty">Memuat archives...</div></div><button id="loadMoreArchives" class="archive-load-more hidden">Muat lebih banyak</button></aside><main class="archive-detail-pane"><div id="archiveEmpty" class="archive-detail-empty"><div class="archive-empty-icon">▱</div><h2>Pilih history chat</h2><p>Klik salah satu archive untuk melihat seluruh percakapan pada session tersebut.</p></div><section id="archiveDetail" class="archive-detail hidden"><header class="archive-detail-head"><button id="archiveBack" class="icon-btn archive-back">←</button><div class="archive-avatar" id="archiveAvatar">?</div><div class="archive-title"><b id="archiveName">-</b><span id="archiveMeta">-</span></div><span class="archive-closed">ARCHIVED</span></header><div id="archiveMessages" class="archive-messages"></div></section></main></div></section><script type="module">import{mountShell}from'/static/js/core/shell.js';await mountShell();await import('/static/js/pages/archives.js');</script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram CTA</title><link rel="stylesheet" href="/static/css/theme.css"><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/layout.css"><link rel="stylesheet" href="/static/css/components.css"><link rel="stylesheet" href="/static/css/forms.css"><link rel="stylesheet" href="/static/css/tables.css"><link rel="stylesheet" href="/static/css/responsive.css"></head><body data-page="telegram-cta"><section id="page-content"><div class="page-head"><div><div class="kpi-label">INTEGRATION / TELEGRAM</div><h1>Telegram CTA</h1><p class="muted">Atur tombol contextual per intent. Perubahan aktif tanpa restart Railway.</p></div><button class="btn ghost" id="refreshBtn">Refresh</button></div><div class="split-2"><form id="ctaForm" class="card"><div class="section-title"><h3 id="ctaFormTitle">Tambah CTA</h3><button type="button" class="btn ghost hidden" id="cancelEdit">Batal Edit</button></div><div class="form-grid"><div class="field"><label>CTA Name</label><input name="name" placeholder="Deposit Check"></div><div class="field"><label>Context / Intent</label><select name="category"><option>DEPOSIT_PROBLEM</option><option>WD_PROBLEM</option><option>RESET_PASSWORD</option><option>BONUS</option><option>ISSUE</option><option>LOSS_COMPLAINT</option><option>CUSTOM</option></select></div><div class="field"><label>Trigger</label><input name="trigger_text" placeholder="deposit belum masuk"></div><div class="field"><label>Button Label</label><input name="button_label" required placeholder="SUDAH MASUK"></div><div class="field"><label>Action / Payload</label><input name="action_key" required placeholder="SUDAH_MASUK"></div><div class="field"><label>Priority</label><input type="number" name="priority" value="100"></div><div class="field"><label>Telegram Category / Chat</label><input name="destination_chat_id" placeholder="opsional"></div><div class="field"><label>Topic ID</label><input name="destination_topic_id" placeholder="opsional"></div><div class="field wide"><label>Response ke Member</label><textarea name="response_text"></textarea></div><label class="check"><input name="active" type="checkbox" checked> Enabled</label><label class="check"><input name="complete_case" type="checkbox" checked> Complete Case</label><label class="check"><input name="keep_ai_active" type="checkbox" checked> Keep AI Active</label><label class="check"><input name="auto_end_chat" type="checkbox"> Auto End Chat</label><div class="field wide"><button class="btn">Simpan CTA</button></div></div></form><div class="card"><div class="section-title"><h3>Preview</h3><span class="badge">Contextual</span></div><div id="ctaPreview" class="notice">Isi form untuk melihat preview tombol.</div></div></div><div class="card section-gap"><div class="table-wrap"><table class="data-table"><thead><tr><th>Priority</th><th>Context</th><th>Button</th><th>Action</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="ctaRows"></tbody></table></div></div></section><script type="module">import{mountShell}from'/static/js/core/shell.js';await mountShell();await import('/static/js/pages/telegram-cta.js');</script></body></html>

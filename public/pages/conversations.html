<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percakapan Member</title>
<link rel="stylesheet" href="/static/css/theme.css"><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/layout.css"><link rel="stylesheet" href="/static/css/components.css"><link rel="stylesheet" href="/static/css/forms.css"><link rel="stylesheet" href="/static/css/conversations.css"><link rel="stylesheet" href="/static/css/responsive.css"></head>
<body data-page="conversations"><section id="page-content" class="conversations-page">
<div class="conversation-layout">
<aside class="inbox"><div class="inbox-header"><div><strong>Inbox</strong><span id="inboxCount" class="subtle">0 aktif</span></div><span id="connectionState" class="connection-state reconnecting">RECONNECTING</span><button class="icon-btn" id="refreshChats" title="Refresh">↻</button></div>
<div class="inbox-tools"><div class="chat-search-wrap"><span>⌕</span><input id="chatSearch" placeholder="Cari member atau pesan..." autocomplete="off"></div><div class="chat-filters"><button class="mini-filter active" data-filter="ALL">Semua</button><button class="mini-filter" data-filter="NEEDS_REPLY">Belum dibalas</button><button class="mini-filter" data-filter="HUMAN">Human</button><button class="mini-filter" data-filter="AI">AI</button></div></div>
<div id="chatList" class="chat-list"><div class="chat-list-loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div><button id="loadMoreChats" class="load-more hidden">Muat chat lainnya</button><div class="inbox-nav-footer" aria-label="Navigasi percakapan"><button id="jumpNewest" class="inbox-nav-hint" type="button" title="Kembali ke percakapan terbaru"><span>Newest</span><span class="nav-separator">·</span><span>Alt+↑/↓</span></button><span id="keyboardNavCount" class="keyboard-nav-count" title="Jumlah percakapan terlihat">0</span></div></aside>
<section class="conversation-pane"><header class="conversation-head"><button class="icon-btn mobile-back" id="mobileBack" title="Kembali">←</button><div class="conversation-identity"><div class="conversation-avatar" id="conversationAvatar">?</div><div class="conversation-name-wrap"><div class="conversation-name-row"><b id="chatName">Pilih percakapan</b><span id="mode" class="state-pill neutral">—</span></div><div class="conversation-session"><span id="chatSession">Tidak ada chat dipilih</span><button id="copySession" class="copy-mini hidden" title="Salin Session ID">Copy</button></div></div></div><div class="conversation-actions"><button class="btn action-primary" id="takeoverBtn">Take Over</button><button class="btn ghost hidden" id="returnAiBtn">Return to AI</button><button class="btn danger" id="endBtn">End Chat</button><button class="icon-btn info-toggle" id="toggleDetails" title="Customer detail">ⓘ</button></div></header>
<div id="conversationNotice" class="conversation-notice hidden"></div><div class="messages" id="messages"><div class="conversation-empty-state"><div class="empty-icon">◌</div><b>Pilih percakapan</b><span>Pilih member dari Inbox untuk mulai menangani chat.</span></div></div>
<div id="imagePreview" class="image-preview hidden"></div><div class="composer-shell"><div id="composerStatus" class="composer-status ai-mode"><span class="composer-status-dot"></span><span>AI aktif. Take Over untuk membalas sebagai CS.</span></div><div class="composer"><label class="attach-btn" id="attachLabel" title="Kirim gambar"><span>＋</span><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label><div class="composer-input-wrap"><div id="shortcutMenu" class="shortcut-menu hidden"></div><textarea id="composerText" rows="1" placeholder="Tulis balasan... Ketik # untuk shortcut" disabled></textarea><div class="composer-footer"><span>Enter kirim · Shift+Enter baris baru</span><span id="charCount">0</span></div></div><button class="send-btn" id="sendBtn" disabled aria-label="Kirim">➤</button></div></div></section>
<aside class="customer-panel" id="customerPanel"><div class="customer-panel-top"><div><span class="panel-eyebrow">CUSTOMER</span><h3>Detail Percakapan</h3></div><button class="icon-btn" id="closeDetails">×</button></div><div id="customerInfo" class="customer-info"><div class="empty compact">Pilih percakapan.</div></div><div class="side-section"><span class="panel-eyebrow">WORKFLOW</span><div id="workflowInfo" class="customer-info"></div></div><div class="side-section"><span class="panel-eyebrow">TAKE OVER</span><div id="takeoverInfo" class="customer-info"></div></div></aside>
</div></section><script type="module">import{mountShell}from'/static/js/core/shell.js';await mountShell();await import('/static/js/pages/conversations.js');</script></body></html>
